name: VPS SSH Test

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -x

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$VPS_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub

          echo "Private key is valid"

      - name: Test DNS and port
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -x

          echo "Testing host: $VPS_HOST"

          getent hosts "$VPS_HOST"

          timeout 10 bash -c "</dev/tcp/$VPS_HOST/22"

          echo "Port 22 is reachable"

      - name: Test SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -x

          ssh-keyscan -T 10 -H "$VPS_HOST" > ~/.ssh/known_hosts

          echo "Known hosts:"
          cat ~/.ssh/known_hosts

          echo "Starting SSH..."

          ssh \
            -v \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "echo SSH_OK"
