name: Docker CI/CD

on:
  push:
    branches: [master, development]

  pull_request:
    branches: [master]

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}

jobs:

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve images
        id: images
        shell: bash
        run: |
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA="${GITHUB_SHA::7}"

          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            CHANNEL=master
            MOVING=latest
          else
            CHANNEL=dev
            MOVING=dev
          fi

          BACKEND="ghcr.io/${REPO_LOWER}-backend"
          FRONTEND="ghcr.io/${REPO_LOWER}-frontend"

          # Two tags per image. The moving one is the convenient handle; the
          # sha one is immutable, and it is what the deploy actually runs - so
          # `docker compose ps` on the VPS names the commit that is live, and the
          # previous build is still addressable when one needs rolling back to.
          # Building only :latest, as this did for a while, left production
          # unidentifiable and every earlier build unreachable.
          echo "backend_tags=${BACKEND}:${MOVING},${BACKEND}:${CHANNEL}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_tags=${FRONTEND}:${MOVING},${FRONTEND}:${CHANNEL}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          echo "backend_image=${BACKEND}:${CHANNEL}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${FRONTEND}:${CHANNEL}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          echo "dockerfile=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.${{ steps.images.outputs.dockerfile }}
          push: true
          tags: ${{ steps.images.outputs.backend_tags }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.${{ steps.images.outputs.dockerfile }}
          push: true
          tags: ${{ steps.images.outputs.frontend_tags }}


  deploy:
    name: Deploy to VPS
    needs: build-and-push

    # فقط master را Deploy کن
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$VPS_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub

      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts

      # The VPS cannot reach ghcr.io at all. TCP to 140.82.121.33:443 never connects
      # -- not a slow handshake, no connection -- while github.com, which lives in the
      # same 140.82.121.x block, answers in 79ms. DNS is fine and resolves to the right
      # address, and forcing that address with `curl --resolve` fails identically. So it
      # is a point block on the registry, and no retry loop can outwait it; the five
      # retries this job used to run just spent five minutes proving that twice.
      #
      # The two links that do work are the runner to ghcr (both are GitHub) and the
      # runner to the VPS over SSH, which connected fine on every failed deploy. So the
      # images travel down the SSH link instead of being pulled on the far side, and
      # the VPS never talks to a registry again.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ship images to the VPS over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
        run: |
          set -euo pipefail

          docker pull "$BACKEND_IMAGE"
          docker pull "$FRONTEND_IMAGE"

          # `docker save` writes its layers uncompressed, so this is not re-compressing
          # already-compressed data -- it roughly halves what crosses the wire. `docker
          # load` detects the gzip on its own, which is why nothing gunzips on the far
          # side. pipefail above matters here: without it a failed save or a dropped ssh
          # would be masked by `docker load` exiting 0 on a truncated stream.
          docker save "$BACKEND_IMAGE" "$FRONTEND_IMAGE" \
            | gzip \
            | ssh \
                -i ~/.ssh/id_ed25519 \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o ServerAliveInterval=30 \
                -o ConnectTimeout=15 \
                "$VPS_USER@$VPS_HOST" 'docker load'

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PROJECT_PATH: ${{ secrets.VPS_PROJECT_PATH }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
        run: |
          # The heredoc is quoted, so nothing below expands on the runner. The three
          # values the remote side needs are handed to it as environment variables on
          # the bash -s command line instead. An unquoted heredoc expands every $ here
          # rather than on the VPS, which would have silently emptied the wait loop.
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "PROJECT_PATH='$VPS_PROJECT_PATH' BACKEND_IMAGE='$BACKEND_IMAGE' FRONTEND_IMAGE='$FRONTEND_IMAGE' bash -s" << 'EOF'

          set -e

          echo "================================="
          echo "Starting deployment"
          echo "================================="

          cd "$PROJECT_PATH"

          echo "Backend image:  $BACKEND_IMAGE"
          echo "Frontend image: $FRONTEND_IMAGE"

          # Nothing is pulled here any more -- the previous step loaded both images over
          # SSH, because this machine cannot reach ghcr.io. This only checks they really
          # arrived. Keep the check: it is what preserves the property the old retry loop
          # had, that a delivery failure leaves the running containers untouched rather
          # than half-recreating the site around a missing image.
          echo "Checking the images arrived..."

          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            if ! docker image inspect "$image" >/dev/null 2>&1; then
              echo "Image $image is not present on this host."
              echo "The running containers have been left untouched."
              exit 1
            fi
            echo "  present: $image"
          done

          echo "Starting containers..."
          docker compose -f compose.prod.yaml up -d backend frontend nginx

          echo "Container status:"
          docker compose -f compose.prod.yaml ps

          # This used to be `sleep 10` followed by a single `curl -f`. A push that
          # actually changes an image recreates the containers, and a cold backend has
          # to wait for MySQL to report healthy, run the Flyway migrations and bring
          # Hibernate up before it listens - well past ten seconds. So nginx was still
          # answering 502 when the one-shot curl fired, and the first deploy of any
          # real change went red while the deployment underneath it had worked.
          echo "Waiting for the site to answer..."

          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 5 http://localhost; then
              echo "Site answered on attempt $i"
              echo "================================="
              echo "Deployment successful"
              echo "================================="
              exit 0
            fi
            sleep 5
          done

          echo "Site did not answer within five minutes."
          docker compose -f compose.prod.yaml ps
          docker compose -f compose.prod.yaml logs --tail=50 backend frontend nginx
          exit 1
          EOF
