name: Docker CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment per branch
        id: env
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA="${GITHUB_SHA::7}"

          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "dockerfile=master" >> "$GITHUB_OUTPUT"
            echo "backend_tags=${{ env.REGISTRY }}/$REPO_LOWER-backend:latest,${{ env.REGISTRY }}/$REPO_LOWER-backend:master-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "frontend_tags=${{ env.REGISTRY }}/$REPO_LOWER-frontend:latest,${{ env.REGISTRY }}/$REPO_LOWER-frontend:master-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "dockerfile=dev" >> "$GITHUB_OUTPUT"
            echo "backend_tags=${{ env.REGISTRY }}/$REPO_LOWER-backend:dev,${{ env.REGISTRY }}/$REPO_LOWER-backend:dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "frontend_tags=${{ env.REGISTRY }}/$REPO_LOWER-frontend:dev,${{ env.REGISTRY }}/$REPO_LOWER-frontend:dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          dockerfile: Dockerfile.${{ steps.env.outputs.dockerfile }}
          push: true
          tags: ${{ steps.env.outputs.backend_tags }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          dockerfile: Dockerfile.${{ steps.env.outputs.dockerfile }}
          push: true
          tags: ${{ steps.env.outputs.frontend_tags }}
