name: Docker CI/CD

on:
  push:
    branches: [master, development]

  pull_request:
    branches: [master]

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}

jobs:

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve images
        id: images
        shell: bash
        run: |
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')

          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "backend_image=ghcr.io/${REPO_LOWER}-backend:latest" >> "$GITHUB_OUTPUT"
            echo "frontend_image=ghcr.io/${REPO_LOWER}-frontend:latest" >> "$GITHUB_OUTPUT"
            echo "dockerfile=master" >> "$GITHUB_OUTPUT"
          else
            echo "backend_image=ghcr.io/${REPO_LOWER}-backend:dev" >> "$GITHUB_OUTPUT"
            echo "frontend_image=ghcr.io/${REPO_LOWER}-frontend:dev" >> "$GITHUB_OUTPUT"
            echo "dockerfile=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.${{ steps.images.outputs.dockerfile }}
          push: true
          tags: ${{ steps.images.outputs.backend_image }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.${{ steps.images.outputs.dockerfile }}
          push: true
          tags: ${{ steps.images.outputs.frontend_image }}


  deploy:
    name: Deploy to VPS
    needs: build-and-push

    # فقط master را Deploy کن
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$VPS_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub

      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PROJECT_PATH: ${{ secrets.VPS_PROJECT_PATH }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" << EOF

          set -e

          echo "================================="
          echo "Starting deployment"
          echo "================================="

          cd "$VPS_PROJECT_PATH"

          echo "Backend image:"
          echo "$BACKEND_IMAGE"

          echo "Frontend image:"
          echo "$FRONTEND_IMAGE"

          echo "Pulling latest images..."

          BACKEND_IMAGE="$BACKEND_IMAGE" \
          FRONTEND_IMAGE="$FRONTEND_IMAGE" \
          docker compose -f compose.prod.yaml pull backend frontend

          echo "Starting containers..."

          BACKEND_IMAGE="$BACKEND_IMAGE" \
          FRONTEND_IMAGE="$FRONTEND_IMAGE" \
          docker compose -f compose.prod.yaml up -d backend frontend nginx

          echo "Waiting for containers..."

          sleep 10

          echo "Container status:"
          docker compose -f compose.prod.yaml ps

          echo "Checking frontend..."

          curl -f http://localhost || exit 1

          echo "================================="
          echo "Deployment successful"
          echo "================================="

          EOF
