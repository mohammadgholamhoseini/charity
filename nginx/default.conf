# A MIRROR OF WHAT RUNS ON THE VPS, at /opt/yariju/charity/nginx/default.conf.
# The deploy copies no files, so an edit here reaches production only when the same
# edit is made on the server by hand. See the header of compose.prod.yaml.

# HTTP
server {
    listen 80;
    server_name yariju.com www.yariju.com;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else -> HTTPS.
    #
    # This redirect is why CORS_ORIGINS must say https://. No browser ever completes a
    # request to the http:// origin, so an http:// entry in the allow-list matches
    # nothing and every login is rejected by Spring's CORS filter with a 403.
    location / {
        return 301 https://$host$request_uri;
    }
}


# HTTPS
server {
    listen 443 ssl;
    server_name yariju.com www.yariju.com;

    ssl_certificate /etc/letsencrypt/live/yariju.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yariju.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # API
    #
    # Straight to the backend -- the request does NOT pass through Nuxt here, unlike the
    # local compose topology. Nothing strips or rewrites the browser's Origin header on
    # the way, so it reaches Spring verbatim and CORS_ORIGINS governs every API call the
    # site makes, login included.
    location /api/ {
        proxy_pass http://backend:8082;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Note: the backend's own limit is MAX_REQUEST_SIZE, which defaults to 40MB.
        # nginx is the tighter of the two, so it is the one that decides -- an upload
        # between 20M and 40M is refused here with a 413 that never reaches Spring.
        client_max_body_size 20M;
    }

    # Frontend
    location / {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
