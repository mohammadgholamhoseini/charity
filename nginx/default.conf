# A MIRROR OF WHAT RUNS ON THE VPS, at /opt/yariju/charity/nginx/default.conf.
# The deploy copies no files, so an edit here reaches production only when the same
# edit is made on the server by hand. See the header of compose.prod.yaml.

# HTTP
server {
    listen 80;
    server_name yariju.com www.yariju.com;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else -> HTTPS.
    #
    # This redirect is why CORS_ORIGINS must say https://. No browser ever completes a
    # request to the http:// origin, so an http:// entry in the allow-list matches
    # nothing and every login is rejected by Spring's CORS filter with a 403.
    location / {
        return 301 https://$host$request_uri;
    }
}


# HTTPS
server {
    listen 443 ssl;
    server_name yariju.com www.yariju.com;

    ssl_certificate /etc/letsencrypt/live/yariju.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yariju.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # API
    #
    # Straight to the backend -- the request does NOT pass through Nuxt here, unlike the
    # local compose topology. Nothing strips or rewrites the browser's Origin header on
    # the way, so it reaches Spring verbatim and CORS_ORIGINS governs every API call the
    # site makes, login included.
    location /api/ {
        proxy_pass http://backend:8082;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Deliberately looser than the backend, whose MAX_REQUEST_SIZE defaults to 40MB.
        # Whichever limit is tighter is the one that answers, and Spring answers better:
        # GlobalExceptionHandler turns MaxUploadSizeExceededException into a 413 carrying
        # the app's Persian error body, where nginx emits a raw HTML error page. This was
        # 20M, which silently swallowed multi-file uploads -- POST /api/center/requests/
        # {id}/documents takes an unbounded List<MultipartFile>, so three 8MB documents
        # were refused here with no usable message. Keep this above MAX_REQUEST_SIZE.
        client_max_body_size 45M;
    }

    # Frontend
    location / {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
