services:
  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-charity}
      MYSQL_USER: ${MYSQL_USER:-charity_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-master:
    build:
      context: ./backend
      dockerfile: Dockerfile.master
    ports:
      - "81:8082"
    env_file: .env
    environment:
      SPRING_PROFILE: default
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-charity}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-charity_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root}
    depends_on:
      mysql:
        condition: service_healthy

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8082"
    env_file: .env
    environment:
      SPRING_PROFILE: local

  frontend-master:
    build:
      context: ./frontend
      dockerfile: Dockerfile.master
    ports:
      - "80:80"
    depends_on:
      - backend-master

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:80"
    depends_on:
      - backend-dev

volumes:
  mysql_data: