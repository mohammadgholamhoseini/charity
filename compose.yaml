services:
  mysql:
    image: mysql:8.4
    container_name: charity-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - charity-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: charity-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}

      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_BASE_URL: ${APP_BASE_URL}

      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED}
      BALE_ENABLED: ${BALE_ENABLED}

      FILE_UPLOAD_DIR: /app/uploads

    ports:
      - "8082:8082"

    volumes:
      - backend_uploads:/app/uploads

    networks:
      - charity-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: charity-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_started

    ports:
      - "80:80"

    networks:
      - charity-network

volumes:
  mysql_data:
  backend_uploads:

networks:
  charity-network:
    driver: bridge
