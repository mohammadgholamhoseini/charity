services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      # Bound to loopback: the database has no business being reachable from the network.
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      # Each branch owns a schema. MYSQL_DATABASE can only create one, so the second is
      # created by the init script below.
      MYSQL_DATABASE: ${MYSQL_DATABASE_MASTER:-YARIJU}
      MYSQL_USER: ${MYSQL_USER:-charity_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      TZ: Asia/Tehran
    volumes:
      - mysql_data:/var/lib/mysql
      # Creates the dev schema and grants charity_user on both. Runs only on a fresh
      # volume, so it will not disturb the schemas that already exist.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-master:
    image: charity-backend:master
    restart: unless-stopped
    ports:
      - "81:8082"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: default
      # serverTimezone matches app.timezone; they disagreed before, which made the
      # absolute meaning of stored timestamps ambiguous.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE_MASTER:-YARIJU}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tehran&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-charity_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      # The site reaches the API through the frontend's own /api route, which strips
      # Origin, so this list governs only direct browser access to port 81 (Swagger, a
      # REST client). It still has to name the real site URL: leaving it at the built-in
      # default is what made the dev deployment answer 403 to every login.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:81}
      APP_SITE_URL: ${APP_SITE_URL:-http://localhost}
      APP_TIMEZONE: Asia/Tehran
      FILE_UPLOAD_DIR: /app/uploads
      TZ: Asia/Tehran
    volumes:
      # Without this every rebuild wiped every uploaded image while leaving the
      # database rows pointing at them.
      - backend_master_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  backend-dev:
    image: charity-backend:dev
    restart: unless-stopped
    ports:
      - "8081:8082"
    env_file: .env
    environment:
      # Was the in-memory H2 `local` profile, which threw the data away on every restart.
      # Development now has its own MySQL schema, so it runs the same profile as production
      # and differs only in which schema it points at.
      SPRING_PROFILES_ACTIVE: default
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE_DEV:-YARIJU_DEVELOPMENT}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tehran&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-charity_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root}
      # This schema is built by Flyway from V1, so Hibernate can validate the entities
      # against it. Production uses `none` only because its schema predates Flyway; keeping
      # the check here is what catches migration/entity drift before it reaches production.
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      # Nothing to baseline — the schema starts empty, so V1 onward all apply. Explicitly
      # off so that a non-empty schema with no history fails loudly instead of silently
      # baselining at V1 and skipping it.
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      # The `local` profile used to seed this; on the production profile there is no
      # default, and without it the empty schema gets no admin and nobody can log in.
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin123}
      # Swagger is on here and is opened straight from the browser against port 8081,
      # which is a genuinely cross-origin call and needs the allow-list. The dev site
      # itself no longer depends on this.
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://localhost:3000
      SPRINGDOC_ENABLED: "true"
      APP_BASE_URL: http://localhost:8081
      APP_SITE_URL: http://localhost:8080
      APP_TIMEZONE: Asia/Tehran
      FILE_UPLOAD_DIR: /app/uploads
      TZ: Asia/Tehran
    volumes:
      - backend_dev_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend-master:
    image: charity-frontend:master
    restart: unless-stopped
    ports:
      # Container port 3000, as of the merge that brought the Nuxt SSR rewrite to master.
      # It used to be 80:80 because master shipped the old static nginx image; both
      # frontends now run the same Node server on 3000 and differ only by environment.
      - "80:3000"
    environment:
      NUXT_API_ORIGIN: http://backend-master:8082
      NUXT_PUBLIC_SITE_URL: ${APP_SITE_URL:-http://localhost}
      # The only deployment permitted to be indexed.
      NUXT_PUBLIC_INDEXABLE: "true"
      TZ: Asia/Tehran
    depends_on:
      - backend-master

  frontend-dev:
    image: charity-frontend:dev
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      NUXT_API_ORIGIN: http://backend-dev:8082
      NUXT_PUBLIC_SITE_URL: http://localhost:8080
      # Leaving this false makes robots.txt serve a blanket Disallow, so the dev site
      # cannot compete with production for the same Persian queries.
      NUXT_PUBLIC_INDEXABLE: "false"
      TZ: Asia/Tehran
    depends_on:
      - backend-dev

volumes:
  mysql_data:
  backend_master_uploads:
  backend_dev_uploads:
