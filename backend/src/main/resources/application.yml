spring:
  application:
    name: charity-backend
  datasource:
    url: jdbc:mysql://localhost:3306/charity?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Tehran&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

server:
  port: 8082

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  channel: ${TELEGRAM_CHANNEL:}
  enabled: ${TELEGRAM_ENABLED:false}

bale:
  bot-token: ${BALE_BOT_TOKEN:}
  channel: ${BALE_CHANNEL:}
  enabled: ${BALE_ENABLED:false}

cors:
  allowed-origins: ${CORS_ORIGINS:http://127.0.0.1:5173}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
